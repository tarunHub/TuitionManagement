server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: student-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_portal}
    username: ${DB_USERNAME:portal}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
    time-zone: America/Toronto
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    web:
      pageable:
        max-page-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lockout: ${LOGIN_LOCKOUT:15m}
  mail:
    from: ${MAIL_FROM:no-reply@smartstart.example.com}
    from-name: ${MAIL_FROM_NAME:Smart Start Tutoring}
  jobs:
    dispatch:
      enabled: ${JOB_DISPATCH_ENABLED:true}
      cron: ${JOB_DISPATCH_CRON:0 * * * * *}
    class-reminder:
      enabled: ${JOB_CLASS_REMINDER_ENABLED:true}
      cron: ${JOB_CLASS_REMINDER_CRON:0 0 18 * * *}
    fee-reminder:
      enabled: ${JOB_FEE_REMINDER_ENABLED:true}
      cron: ${JOB_FEE_REMINDER_CRON:0 0 9 5 * *}
  google:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:}
    application-name: ${GOOGLE_APPLICATION_NAME:Smart Start Portal}
    send-invites: ${GOOGLE_SEND_INVITES:false}

logging:
  level:
    root: INFO
    com.smartstart.portal: INFO
